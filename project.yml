name: DiskMap
options:
  bundleIdPrefix: uk.lbsi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  DiskMap:
    type: application
    platform: macOS
    sources: [DiskMap]
    settings:
      base:
        PRODUCT_NAME: Disk Map
        PRODUCT_BUNDLE_IDENTIFIER: uk.lbsi.DiskMap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Disk Map
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 LBSi UK / Leon Brahams"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DiskMapTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DiskMapTests]
    dependencies:
      - target: DiskMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Disk Map.app/Contents/MacOS/Disk Map"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DiskMap:
    build:
      targets:
        DiskMap: all
        DiskMapTests: [test]
    test:
      targets: [DiskMapTests]
